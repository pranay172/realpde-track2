name: Data-free public snapshot checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check source, docs and environment snapshots
        run: python3 -S -B scripts/check_archive.py
      - name: Check release payload and reachable history
        run: python3 -S -B scripts/publication_audit.py
      - name: Test release guards
        run: python3 -S -B -m unittest discover -s tests -p test_publication_checks.py
      - name: Test dependency-free sampling selection logic
        run: python3 -S -B -m unittest discover -s tests -p test_sampling_study_summary.py
